        const Roster = ({ staff, setSelectedStaffId, setActiveTab, setShowAddModal, checkAutomation, onEndWeek }) => {
            const [filter, setFilter] = useState('');
            const filtered = staff.filter(s => s.status !== 'Alumni' && (s.name?.toLowerCase().includes(filter.toLowerCase()) || s.discordId?.toLowerCase().includes(filter.toLowerCase()))).sort((a,b) => ROLE_HIERARCHY[a.role] - ROLE_HIERARCHY[b.role]);
            return (
                <div className="bg-gray-800 rounded-lg border border-gray-700 flex flex-col h-full">
                    <div className="p-4 border-b border-gray-700 flex gap-4 items-center">
                        <div className="relative flex-1"><Search className="absolute left-3 top-2.5 w-4 h-4 text-gray-500" /><input className="w-full bg-gray-900 border border-gray-700 rounded-lg pl-9 pr-4 py-2 text-sm text-white focus:outline-none" placeholder="Search staff..." value={filter} onChange={e => setFilter(e.target.value)} /></div>
                        <button onClick={() => setShowAddModal(true)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2"><UserPlus size={16} /> Add</button>
                        <button onClick={onEndWeek} className="bg-red-700 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-2" title="End Week (Reset & Archive Stats)"><RotateCcw size={16} /> End Week</button>
                        <button onClick={checkAutomation} className="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded-lg text-sm" title="Run Automation"><RefreshCw size={16} /></button>
                    </div>
                    <div className="flex-1 overflow-auto p-2 space-y-1">{filtered.map(s => { const metQuota = (parseInt(s.weeklyTickets) || 0) >= QUOTA.TICKETS && (parseInt(s.weeklyMessages) || 0) >= QUOTA.MESSAGES; return ( <div key={s.id} onClick={() => { setSelectedStaffId(s.id); setActiveTab('profile'); }} className="grid grid-cols-12 gap-4 p-3 rounded hover:bg-gray-700/50 cursor-pointer items-center border border-transparent hover:border-gray-600"><div className="col-span-4 flex items-center gap-3"><div className="relative"><img src={s.avatarUrl} className="w-8 h-8 rounded-full bg-gray-700" /><div className={`absolute -bottom-1 -right-1 w-3 h-3 rounded-full border border-gray-800 ${metQuota ? 'bg-green-500' : 'bg-red-500'}`} title={metQuota ? "Quota Met" : "Quota Failed"}></div></div><div><div className="font-bold text-white text-sm">{s.name}</div><div className="text-xs text-gray-500">{s.discordId}</div></div></div><div className="col-span-3 text-xs text-gray-300"><span className={ROLE_COLORS[s.role]}>{s.role}</span></div><div className="col-span-2"><span className={`text-xs px-2 py-1 rounded border ${getStatusColor(s.status, s.strikes)}`}>{s.isOnLoa ? 'LOA' : s.status}</span></div><div className="col-span-2 text-xs text-gray-400"><div className="flex flex-col"><span>Joined: {formatDate(s.joinedDate)}</span><span className="text-[10px] text-gray-500">Active: {formatDate(s.lastActiveDate)}</span></div></div><div className="col-span-1 text-right font-bold text-sm text-red-500">{s.strikes > 0 ? s.strikes : ''}</div></div> ); })}</div>
                </div>
            );
        };

        const Handbook = () => {
            const [aiQuery, setAiQuery] = useState('');
            const [aiAnswer, setAiAnswer] = useState('');
            const [aiLoading, setAiLoading] = useState(false);
            const handleAskHandbook = async () => { if (!aiQuery) return; setAiLoading(true); const context = HANDBOOK_RULES.map(r => `${r.code} ${r.title}: ${r.desc}`).join('\n'); const prompt = `You are the Head Admin of a gaming community. Based ONLY on the following rules, answer the user's question clearly and authoritatively. If the answer isn't in the rules, state that it's a gap in policy.\n\nRules Context:\n${context}\n\nUser Question: ${aiQuery}`; const response = await callGemini(prompt); setAiAnswer(response); setAiLoading(false); };
            return (
                <div className="bg-gray-800 rounded-lg border border-gray-700 h-full flex flex-col overflow-hidden">
                    <div className="p-6 border-b border-gray-700 bg-gray-900/50"><h2 className="text-2xl font-bold text-white flex items-center gap-3"><BookOpen className="text-blue-500"/> Handbook Quick Ref</h2></div>
                    <div className="p-4 bg-gray-900 border-b border-gray-700"><div className="flex gap-2"><div className="relative flex-1"><Bot className="absolute left-3 top-2.5 w-4 h-4 text-purple-400" /><input className="w-full bg-gray-800 border border-gray-700 rounded-lg pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-purple-500" placeholder="Ask the AI about policies (e.g., 'What counts as inactivity?')" value={aiQuery} onChange={e => setAiQuery(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAskHandbook()} /></div><button onClick={handleAskHandbook} disabled={aiLoading} className="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2">{aiLoading ? <Loader2 className="animate-spin" size={16}/> : <Sparkles size={16}/>} Ask AI</button></div>{aiAnswer && ( <div className="mt-4 p-4 bg-purple-900/20 border border-purple-500/30 rounded-lg text-sm text-gray-200 markdown-prose animate-in fade-in"><div className="flex justify-between items-start mb-2"><span className="text-purple-400 font-bold text-xs uppercase tracking-widest flex items-center gap-2"><Bot size={12}/> AI Response</span><button onClick={() => setAiAnswer('')} className="text-gray-500 hover:text-white"><X size={14}/></button></div><div className="whitespace-pre-line">{aiAnswer}</div></div> )}</div>
                    <div className="flex-1 overflow-auto p-6 space-y-6">{HANDBOOK_RULES.map(r => ( <div key={r.code} className="bg-gray-900 p-4 rounded border border-gray-700"><span className="text-blue-400 font-mono font-bold mr-2">{r.code}</span><span className="text-white font-medium">{r.title}</span><p className="text-xs text-gray-400 mt-1">{r.desc}</p></div> ))}</div>
                </div>
            );
        };

        const AlumniView = ({ staff, setSelectedStaffId, setActiveTab }) => {
            const alumni = staff.filter(s => s.status === 'Alumni').sort((a,b) => new Date(b.exitDate) - new Date(a.exitDate));
            return (
                <div className="bg-gray-800 rounded-lg border border-gray-700 h-full flex flex-col">
                    <div className="p-4 border-b border-gray-700 bg-gray-900/50"><h2 className="text-xl font-bold text-white flex items-center gap-2"><Archive className="text-gray-400"/> Alumni Archive</h2></div>
                    <div className="flex-1 overflow-auto p-4 space-y-2">{alumni.length === 0 ? <div className="text-gray-500 text-center py-10">No alumni records found.</div> : alumni.map(s => ( <div key={s.id} onClick={() => { setSelectedStaffId(s.id); setActiveTab('profile'); }} className="flex justify-between items-center p-4 bg-gray-900 rounded border border-gray-700 hover:bg-gray-700 cursor-pointer"><div className="flex items-center gap-4"><img src={s.avatarUrl} className="w-10 h-10 rounded-full grayscale opacity-70" /><div><div className="font-bold text-gray-300">{s.name}</div><div className="text-xs text-gray-500">{s.role} • Left: {formatDate(s.exitDate)}</div></div></div><div className="text-right"><span className={`text-xs px-2 py-1 rounded border ${s.rehireEligible ? 'bg-green-900/20 text-green-400 border-green-900' : 'bg-red-900/20 text-red-400 border-red-900'}`}>{s.rehireEligible ? 'Rehire Eligible' : 'Do Not Rehire'}</span><div className="text-xs text-gray-500 mt-1">{s.exitReason}</div></div></div> ))}</div>
                </div>
            );
        };

        const AddStaffModal = ({ addStaff, setShowAddModal }) => {
            const [formData, setFormData] = useState({ name: '', discordId: '', role: 'Trial Moderator', country: '', timezone: '', joinedDate: new Date().toISOString().split('T')[0] });
            const handleSubmit = () => {
                if(!formData.name || !formData.discordId) return alert("Name and Discord ID required");
                const newMember = { id: Date.now().toString(), ...formData, status: formData.role === 'Trial Moderator' ? 'Trial' : 'Active', language: 'English', joinedDate: formData.joinedDate, lastActiveDate: new Date().toISOString().split('T')[0], strikes: 0, strikeHistory: [], isOnLoa: false, weeklyTickets: 0, weeklyMessages: 0, totalTickets: 0, totalMessages: 0, notes: [], avatarUrl: getAvatarUrl(formData.name, formData.role) };
                addStaff(newMember);
            };
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 animate-in fade-in">
                    <div className="bg-gray-800 p-6 rounded-lg w-[500px] border border-gray-600">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><UserPlus size={20}/> Onboard New Staff</h3>
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4"><Input label="Username" required value={formData.name} onChange={v => setFormData({...formData, name: v})} /><Input label="Discord ID" required value={formData.discordId} onChange={v => setFormData({...formData, discordId: v})} /></div>
                            <div className="grid grid-cols-2 gap-4"><div><label className="block text-gray-400 text-xs mb-1">Role</label><select className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white text-sm" value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})}>{Object.keys(ROLE_HIERARCHY).map(r => <option key={r} value={r}>{r}</option>)}</select></div><Input label="Join Date" type="date" value={formData.joinedDate} onChange={v => setFormData({...formData, joinedDate: v})} /></div>
                            <div className="grid grid-cols-2 gap-4"><Input label="Country" value={formData.country} onChange={v => setFormData({...formData, country: v})} /><Input label="Timezone (e.g. EST, GMT)" value={formData.timezone} onChange={v => setFormData({...formData, timezone: v})} /></div>
                        </div>
                        <div className="flex justify-end gap-2 mt-6"><button onClick={() => setShowAddModal(false)} className="text-gray-400 px-4 py-2 text-sm hover:text-white">Cancel</button><button onClick={handleSubmit} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm">Onboard Staff</button></div>
                    </div>
                </div>
            );
        };

        const SettingsView = ({ apiKeyInput, setApiKeyInput, saveApiKey, handleExport, handleImport }) => (
            <div className="max-w-xl mx-auto mt-10 space-y-8">
                <div className="bg-gray-800 p-6 rounded-lg border border-gray-700"><h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><Key size={20} /> API Configuration</h3><p className="text-gray-400 text-sm mb-4">Your Gemini API Key is pre-loaded and secure.</p><div className="flex gap-2"><input type="password" value={apiKeyInput} onChange={e => setApiKeyInput(e.target.value)} className="flex-1 bg-gray-900 border border-gray-700 rounded p-2 text-white" placeholder="API Key" /><button onClick={saveApiKey} className="bg-green-600 text-white px-4 rounded text-sm">Update</button></div></div>
                <div className="bg-gray-800 p-6 rounded-lg border border-gray-700"><h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><Database size={20} /> Data Backup</h3><div className="flex gap-4"><button onClick={handleExport} className="bg-blue-600 text-white px-4 py-2 rounded flex items-center gap-2"><Download size={16}/> Export JSON</button><label className="bg-gray-700 text-white px-4 py-2 rounded flex items-center gap-2 cursor-pointer hover:bg-gray-600"><Upload size={16}/> Import JSON<input type="file" className="hidden" accept=".json" onChange={handleImport} /></label></div></div>
            </div>
        );

        const StaffAdminTool = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [staff, setStaff] = useState(() => JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || INITIAL_STAFF);
            const [selectedStaffId, setSelectedStaffId] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [showReportModal, setShowReportModal] = useState(false);
            const [showEndWeekModal, setShowEndWeekModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");
            const [listModalConfig, setListModalConfig] = useState(null);
            const [apiKeyInput, setApiKeyInput] = useState(() => localStorage.getItem(API_KEY_STORAGE_KEY) || DEFAULT_API_KEY);
            const [deletingId, setDeletingId] = useState(null);

            useEffect(() => { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(staff)); }, [staff]);

            const stats = useMemo(() => {
                const activeStaff = staff.filter(s => s.status !== 'Alumni');
                const regionCounts = { Americas: 0, EMEA: 0, APAC: 0, Oceania: 0, Unknown: 0 };
                activeStaff.forEach(s => { regionCounts[getRegionFromTimezone(s.timezone, s.country)]++; });
                return {
                    total: activeStaff.length,
                    loa: activeStaff.filter(s => s.isOnLoa).length,
                    roleBreakdown: {
                        cm: activeStaff.filter(s => s.role === 'Community Manager').length,
                        sm: activeStaff.filter(s => s.role === 'Staff Manager').length,
                        head: activeStaff.filter(s => s.role === 'Head of Moderation').length,
                        mod: activeStaff.filter(s => s.role === 'Moderator').length,
                        trial: activeStaff.filter(s => s.role === 'Trial Moderator').length,
                    },
                    pendingReview: activeStaff.filter(s => s.status === 'Trial' && calculateTimeInService(s.joinedDate).totalDays >= 14).length,
                    atRisk: activeStaff.filter(s => s.strikes >= 2 || calculateTimeInService(s.lastActiveDate).totalDays > 7).length,
                    regions: regionCounts
                };
            }, [staff]);

            const selectedStaff = useMemo(() => staff.find(s => s.id === selectedStaffId), [staff, selectedStaffId]);
            const filteredTimezones = GLOBAL_TIMEZONES.filter(item => item.country.toLowerCase().includes(searchQuery.toLowerCase()) || item.zone.toLowerCase().includes(searchQuery.toLowerCase()));

            const addStaff = (member) => { setStaff([...staff, member]); setShowAddModal(false); };
            const updateStaff = (updatedMember) => { setStaff(prevStaff => prevStaff.map(s => s.id === updatedMember.id ? updatedMember : s)); };
            const deleteStaff = (id) => { setDeletingId(id); };
            const archiveStaff = (id, reason, standing) => { const member = staff.find(s => s.id === id); if (!member) return; const archivedMember = { ...member, status: 'Alumni', exitDate: new Date().toISOString().split('T')[0], exitReason: reason, rehireEligible: standing, isOnLoa: false, loaReturnDate: undefined }; updateStaff(archivedMember); setSelectedStaffId(null); setActiveTab('alumni'); };
            const checkAutomation = () => {
                const today = new Date().toISOString().split('T')[0];
                let automatedNotes = [];
                let hasUpdates = false;
                const updatedStaff = staff.map(s => {
                    if (s.status === 'Alumni') return s;
                    let newStatus = s.status;
                    let newIsOnLoa = s.isOnLoa;
                    let newLoaReturnDate = s.loaReturnDate;
                    let newStrikeHistory = [...s.strikeHistory];
                    let newNotes = [...s.notes];
                    let changed = false;
                    if (s.isOnLoa && s.loaReturnDate && today >= s.loaReturnDate) { newIsOnLoa = false; newStatus = 'Active'; newLoaReturnDate = undefined; newNotes.push({ id: Date.now(), date: today, author: 'System', content: 'Auto-return from LOA.' }); automatedNotes.push(`AUTO: ${s.name} returned from LOA.`); changed = true; }
                    newStrikeHistory = newStrikeHistory.map(strike => { if (strike.active && strike.expiryDate && today >= strike.expiryDate) { automatedNotes.push(`AUTO: Strike Lvl ${strike.level} expired for ${s.name}.`); changed = true; return { ...strike, active: false }; } return strike; });
                    const inactiveDays = calculateTimeInService(s.lastActiveDate).totalDays;
                    const hasStrike = (lvl, reason) => newStrikeHistory.some(st => st.active && st.level === lvl && st.reason.includes(reason));
                    if (!newIsOnLoa && s.role !== 'Community Manager') {
                        if (inactiveDays >= 7 && !hasStrike(1, 'Inactive (7 Days)')) { const expiry = new Date(); expiry.setDate(new Date().getDate() + 30); newStrikeHistory.push({ date: today, expiryDate: expiry.toISOString().split('T')[0], level: 1, reason: 'Auto: Inactive (7 Days)', active: true }); newNotes.push({ id: Date.now() + 1, date: today, author: 'System', content: 'Issued Strike 1: Inactive > 7 Days' }); automatedNotes.push(`AUTO: Strike 1 issued to ${s.name} (7+ days inactive).`); changed = true; }
                        if (inactiveDays >= 14 && !hasStrike(2, 'Inactive (14 Days)')) { const expiry = new Date(); expiry.setDate(new Date().getDate() + 60); newStrikeHistory.push({ date: today, expiryDate: expiry.toISOString().split('T')[0], level: 2, reason: 'Auto: Inactive (14 Days)', active: true }); newNotes.push({ id: Date.now() + 2, date: today, author: 'System', content: 'Issued Strike 2: Inactive > 14 Days' }); automatedNotes.push(`AUTO: Strike 2 issued to ${s.name} (14+ days inactive).`); changed = true; }
                        if (inactiveDays >= 31 && !hasStrike(3, 'Inactive (31 Days)')) { const expiry = new Date(); expiry.setDate(new Date().getDate() + 90); newStrikeHistory.push({ date: today, expiryDate: expiry.toISOString().split('T')[0], level: 3, reason: 'Auto: Inactive (31 Days)', active: true }); newNotes.push({ id: Date.now() + 3, date: today, author: 'System', content: 'Issued Strike 3: Inactive > 31 Days' }); automatedNotes.push(`AUTO: Strike 3 issued to ${s.name} (31+ days inactive).`); changed = true; }
                    }
                    const newTotalStrikes = newStrikeHistory.filter(st => st.active).reduce((sum, st) => sum + st.level, 0);
                    if (newTotalStrikes !== s.strikes) changed = true;
                    if (!newIsOnLoa && s.role !== 'Community Manager') { if (inactiveDays > 14) { if (newStatus !== 'Inactive') { newStatus = 'Inactive'; changed = true; } } else if (inactiveDays <= 7 && s.status === 'Inactive') { newStatus = 'Active'; changed = true; } }
                    if (changed) { hasUpdates = true; return { ...s, status: newStatus, isOnLoa: newIsOnLoa, loaReturnDate: newLoaReturnDate, strikeHistory: newStrikeHistory, strikes: newTotalStrikes, notes: newNotes }; }
                    return s;
                });
                if (hasUpdates) setStaff(updatedStaff);
                alert(automatedNotes.length > 0 ? `Automation Run:\n${automatedNotes.join('\n')}` : 'Automation Run: No changes needed.');
            };

            const resetWeeklyActivity = () => {
                setShowEndWeekModal(true);
            };

            const saveApiKey = () => { localStorage.setItem(API_KEY_STORAGE_KEY, apiKeyInput); alert("API Key saved securely."); };
            const handleExport = () => { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(staff, null, 2)); const anchor = document.createElement('a'); anchor.href = dataStr; anchor.download = `rescue_ops_backup_${new Date().toISOString().split('T')[0]}.json`; document.body.appendChild(anchor); anchor.click(); anchor.remove(); };
            const handleImport = (event) => { const fileReader = new FileReader(); if (event.target.files && event.target.files[0]) { fileReader.readAsText(event.target.files[0], "UTF-8"); fileReader.onload = e => { try { const parsed = JSON.parse(e.target.result); if (Array.isArray(parsed)) { setStaff(parsed); alert("Database restored!"); } } catch(err) { alert("Invalid file."); } }; } };

            return (
                <div className="flex h-screen overflow-hidden">
                    <aside className="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
                        <div className="p-6 border-b border-gray-700"><h1 className="text-red-500 font-bold flex items-center gap-2"><Shield /> ADMIN CONSOLE</h1><p className="text-xs text-gray-500 mt-1 uppercase tracking-widest">Rescue Ops: Wildfire</p></div>
                        <nav className="p-4 space-y-2 flex-1">
                            <button onClick={() => {setActiveTab('dashboard'); setSelectedStaffId(null);}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${activeTab==='dashboard'?'bg-blue-900/20 text-blue-400 border border-blue-900/50':'text-gray-400 hover:text-white hover:bg-gray-700'}`}><BarChart3 size={20}/> Dashboard</button>
                            <button onClick={() => {setActiveTab('roster'); setSelectedStaffId(null);}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${activeTab==='roster'?'bg-blue-900/20 text-blue-400 border border-blue-900/50':'text-gray-400 hover:text-white hover:bg-gray-700'}`}><Users size={20}/> Roster</button>
                            
                            {/* New Templates Tab */}
                            <button onClick={() => {setActiveTab('templates'); setSelectedStaffId(null);}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${activeTab==='templates'?'bg-blue-900/20 text-blue-400 border border-blue-900/50':'text-gray-400 hover:text-white hover:bg-gray-700'}`}><MessageSquare size={20}/> Templates</button>
                            
                            <button onClick={() => {setActiveTab('handbook'); setSelectedStaffId(null);}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${activeTab==='handbook'?'bg-blue-900/20 text-blue-400 border border-blue-900/50':'text-gray-400 hover:text-white hover:bg-gray-700'}`}><BookOpen size={20}/> Handbook</button>
                            <button onClick={() => {setActiveTab('alumni'); setSelectedStaffId(null);}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${activeTab==='alumni'?'bg-blue-900/20 text-blue-400 border border-blue-900/50':'text-gray-400 hover:text-white hover:bg-gray-700'}`}><Archive size={20}/> Alumni</button>
                            <div className="pt-4 mt-4 border-t border-gray-700">
                                <button onClick={() => setShowAddModal(true)} className="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-400 hover:text-white hover:bg-gray-700"><UserPlus size={20}/> Add Staff</button>
                                <button onClick={() => {setActiveTab('settings'); setSelectedStaffId(null);}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${activeTab==='settings'?'bg-blue-900/20 text-blue-400 border border-blue-900/50':'text-gray-400 hover:text-white hover:bg-gray-700'}`}><Settings size={20}/> Settings</button>
                            </div>
                        </nav>
                    </aside>
                    <main className="flex-1 bg-gray-900 flex flex-col overflow-hidden">
                        <header className="h-16 bg-gray-900 border-b border-gray-700 flex items-center justify-between px-6"><h2 className="text-xl font-bold text-white capitalize">{activeTab === 'profile' ? 'Staff Profile' : activeTab}</h2><div className="flex items-center gap-4"><div className="text-right"><div className="text-sm font-bold text-white">Staff Manager</div><div className="text-xs text-purple-400">Admin</div></div><div className="w-10 h-10 rounded-full bg-purple-900 flex items-center justify-center font-bold text-purple-200">SM</div></div></header>
                        <div className="flex-1 overflow-auto p-6">
                            {activeTab === 'dashboard' && <Dashboard staff={staff} stats={stats} setSelectedStaffId={setSelectedStaffId} setActiveTab={setActiveTab} setShowReportModal={setShowReportModal} filteredTimezones={filteredTimezones} searchQuery={searchQuery} setSearchQuery={setSearchQuery} listModalConfig={listModalConfig} setListModalConfig={setListModalConfig} />}
                            {activeTab === 'roster' && <Roster staff={staff} setSelectedStaffId={setSelectedStaffId} setActiveTab={setActiveTab} setShowAddModal={setShowAddModal} checkAutomation={checkAutomation} onEndWeek={resetWeeklyActivity} />}
                            
                            {/* New Templates Render */}
                            {activeTab === 'templates' && <TemplatesView staff={staff} />}
                            
                            {activeTab === 'handbook' && <Handbook />}
                            {activeTab === 'alumni' && <AlumniView staff={staff} setSelectedStaffId={setSelectedStaffId} setActiveTab={setActiveTab} />}
                            {activeTab === 'settings' && <SettingsView apiKeyInput={apiKeyInput} setApiKeyInput={setApiKeyInput} saveApiKey={saveApiKey} handleExport={handleExport} handleImport={handleImport} />}
                            {activeTab === 'profile' && <ProfileView selectedStaff={selectedStaff} updateStaff={updateStaff} archiveStaff={archiveStaff} deleteStaff={deleteStaff} key={selectedStaff ? selectedStaff.id : 'profile'} />}
                        </div>
                    </main>
                    {showAddModal && <AddStaffModal addStaff={addStaff} setShowAddModal={setShowAddModal} />}
                    {showReportModal && <ReportModal onClose={() => setShowReportModal(false)} />}
                    {showEndWeekModal && <EndWeekModal staff={staff} setStaff={setStaff} onClose={() => setShowEndWeekModal(false)} />}
                    {deletingId && <DeleteProfileModal 
                        staffMember={staff.find(s => s.id === deletingId)}
                        onDelete={() => {
                            setStaff(prev => prev.filter(s => s.id !== deletingId));
                            setSelectedStaffId(null);
                            setActiveTab('roster');
                            setDeletingId(null);
                        }}
                        onClose={() => setDeletingId(null)}
                    />}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<StaffAdminTool />);
    </script>
</body>
</html>

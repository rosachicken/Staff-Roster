        async function callGemini(prompt) {
            const apiKey = localStorage.getItem(API_KEY_STORAGE_KEY) || DEFAULT_API_KEY;
            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    }
                );

                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
                return text.replace(/\*/g, '');
            } catch (error) {
                console.error("Gemini API call failed", error);
                return "Error generating content. Check your API Key or connection.";
            }
        }

        const formatDate = (isoString) => {
            if (!isoString) return '';
            if (typeof isoString === 'string' && isoString.match(/^\d{4}-\d{2}-\d{2}$/)) {
                const [year, month, day] = isoString.split('-');
                return `${day}.${month}.${year}`;
            }
            try {
                const d = new Date(isoString);
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                return `${day}.${month}.${year}`;
            } catch (e) {

            { id: '13', name: 'Tech_Support', discordId: 'sm_013', role: 'Staff Manager', language: 'Hindi/English', status: 'Active', avatarUrl: getAvatarUrl('Tech_Support', 'Staff Manager'), joinedDate: '2023-04-01', lastActiveDate: new Date().toISOString().split('T')[0], strikes: 0, strikeHistory: [], isOnLoa: false, country: 'India', timezone: 'IST (New Delhi)', weeklyTickets: 40, weeklyMessages: 900, totalTickets: 1500, totalMessages: 20000, notes: [] },
            { id: '14', name: 'Safari_Joe', discordId: 'mod_014', role: 'Moderator', language: 'English', status: 'Active', avatarUrl: getAvatarUrl('Safari_Joe', 'Moderator'), joinedDate: '2023-09-01', lastActiveDate: new Date().toISOString().split('T')[0], strikes: 0, strikeHistory: [], isOnLoa: false, country: 'South Africa', timezone: 'SAST (Johannesburg)', weeklyTickets: 12, weeklyMessages: 350, totalTickets: 180, totalMessages: 4000, notes: [] },
            { id: '15', name: 'Late_Night_Owl', discordId: 'trial_015', role: 'Trial Moderator', language: 'English', status: 'Trial', avatarUrl: getAvatarUrl('Late_Night_Owl', 'Trial Moderator'), joinedDate: new Date(Date.now() - 14 * 24 * 60 * 60 * 1000).toISOString().split('T')[0], lastActiveDate: new Date().toISOString().split('T')[0], strikes: 0, strikeHistory: [], isOnLoa: false, country: 'United States', timezone: 'CST (Chicago)', weeklyTickets: 15, weeklyMessages: 400, totalTickets: 30, totalMessages: 700, notes: [] }

        const Input = ({ label, onChange, required, value, type = 'text' }) => (
            <div>
                <label className="block text-gray-400 text-xs mb-1">{label} {required && '*'}</label>
                <input required={required} type={type} value={value || ''} onChange={e => onChange(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white text-sm focus:border-blue-500 focus:outline-none" />
            </div>
        );

        const TemplatesView = ({ staff }) => {
            const [category, setCategory] = useState("POSITIVE & RECOGNITION");
            const [selectedTemplateIndex, setSelectedTemplateIndex] = useState(0);
            const [selectedStaffId, setSelectedStaffId] = useState("");
            const [ticketId, setTicketId] = useState("");
            const [copied, setCopied] = useState(false);

            const activeStaff = useMemo(() => {
                if (!staff) return [];
                return staff.filter(s => s.status !== 'Alumni').sort((a,b) => (a.name || "").localeCompare(b.name || ""));
            }, [staff]);
            
            const categoryTemplates = MESSAGE_TEMPLATES[category] || [];
            const template = categoryTemplates[selectedTemplateIndex];

            const generatedMessage = useMemo(() => {
                if (!template) return "";
                let msg = template.content;
                
                const staffMember = staff.find(s => s.id === selectedStaffId);
                const name = staffMember ? staffMember.name : "[Staff Name]";
                
                msg = msg.replace(/{{name}}/g, name);
                msg = msg.replace(/{{ticket_id}}/g, ticketId || "[Ticket ID]");
                
                return msg;
            }, [category, selectedTemplateIndex, selectedStaffId, ticketId, staff, template]);

            const handleCopy = () => {
                copyToClipboard(generatedMessage);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="flex h-full gap-6">
                    {/* Controls */}
                    <div className="w-1/3 bg-gray-800 rounded-lg border border-gray-700 flex flex-col overflow-hidden">

                                >
                                    {Object.keys(MESSAGE_TEMPLATES).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                </select>
                            </div>
                            
                            <div>
                                <label className="block text-gray-400 text-xs font-bold uppercase mb-2">2. Template</label>
                                <div className="space-y-1">
                                    {(MESSAGE_TEMPLATES[category] || []).map((t, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setSelectedTemplateIndex(idx)}
                                            className={`w-full text-left px-3 py-2 rounded text-sm transition-colors ${selectedTemplateIndex === idx ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400 hover:bg-gray-700'}`}
                                        >

                            </div>

                                    <div>
                                        <label className="text-xs text-gray-500 block mb-1">Staff Member</label>
                                        <select 
                                            className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm"
                                            value={selectedStaffId}
                                            onChange={(e) => setSelectedStaffId(e.target.value)}
                                        >
                                            <option value="">-- Select Staff --</option>
                                            {activeStaff.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                        </select>
                                    </div>
                                    {template && template.content.includes("{{ticket_id}}") && (
                                        <div>
                                            <label className="text-xs text-gray-500 block mb-1">Ticket ID</label>
                                            <input 
                                                type="text" 
                                                className="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white text-sm"
                                                placeholder="e.g. 12345"
                                                value={ticketId}
                                                onChange={(e) => setTicketId(e.target.value)}
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Preview */}
                    <div className="flex-1 bg-gray-800 rounded-lg border border-gray-700 flex flex-col overflow-hidden">
                        <div className="p-4 border-b border-gray-700 bg-gray-900/50 flex justify-between items-center">
                            <h2 className="text-lg font-bold text-white flex items-center gap-2"><FileText size={20} className="text-green-400"/> Message Preview</h2>
                            <span className="text-xs bg-gray-700 text-gray-300 px-2 py-1 rounded border border-gray-600">Discord Ready</span>
                        </div>
                        <div className="flex-1 p-6 bg-gray-900">
                            <textarea 
                                className="w-full h-full bg-transparent text-gray-300 font-mono text-sm focus:outline-none resize-none"
                                value={generatedMessage}
                                readOnly
                            />

                                onClick={handleCopy}

                            >
                                {copied ? <Check size={18}/> : <Copy size={18}/>} 
                                {copied ? 'Copied!' : 'Copy to Clipboard'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const StatCard = ({ label, value, icon, alert, onClick }) => (
            <div onClick={onClick} className={`bg-gray-800 p-4 rounded-lg border ${alert ? 'border-red-500 animate-pulse' : 'border-gray-700'} flex items-center justify-between ${onClick ? 'cursor-pointer hover:bg-gray-700 transition-colors shadow-lg hover:shadow-xl' : ''}`}>
                <div><p className="text-gray-400 text-xs uppercase font-bold tracking-wider">{label}</p><p className="text-3xl font-bold text-white mt-1">{value}</p></div>
                <div className={`p-3 rounded-lg ${alert ? 'bg-red-900/20' : 'bg-gray-700/30'}`}>{icon}</div>
            </div>
        );

        const CoverageBar = ({ label, count, total, color }) => {
            const percent = total > 0 ? (count / total) * 100 : 0;
            return (
                <div>
                    <div className="flex justify-between text-xs mb-1"><span className="text-gray-300 font-bold">{label}</span><span className="text-gray-500">{count} staff ({Math.round(percent)}%)</span></div>
                    <div className="w-full bg-gray-900 rounded-full h-2"><div className={`h-2 rounded-full ${color}`} style={{ width: `${percent}%` }}></div></div>
                </div>
            );
        };

        const ProfileView = ({ selectedStaff, updateStaff, archiveStaff, deleteStaff }) => {
            if (!selectedStaff) return null;
            const [editMode, setEditMode] = useState(false);
            const [editFormData, setEditFormData] = useState(null);
            const [showStrikeModal, setShowStrikeModal] = useState(false);
            const [showOffboardModal, setShowOffboardModal] = useState(false);
            const [showLoaModal, setShowLoaModal] = useState(false);
            const [showStatsModal, setShowStatsModal] = useState(false);
            const [noteText, setNoteText] = useState("");
            const [loaDate, setLoaDate] = useState("");
            const [statsUpdate, setStatsUpdate] = useState({ tickets: 0, messages: 0 });
            const [sLevel, setSLevel] = useState(1);
            const [sReason, setSReason] = useState("");
            const [sGenerating, setSGenerating] = useState(false);
            const [exitReason, setExitReason] = useState('Resigned');
            const [rehire, setRehire] = useState(true);
            const [showNotifModal, setShowNotifModal] = useState(false);
            const [notifContent, setNotifContent] = useState("");
            const [notifType, setNotifType] = useState("generic");
            const [summary, setSummary] = useState('');
            const [sumLoading, setSumLoading] = useState(false);

            const timeline = useMemo(() => {
                const rawEvents = [];

                (selectedStaff.notes || []).forEach(n => rawEvents.push({ rawDate: n.date, type: 'note', content: n.content, sub: n.author, icon: <FileText size={14}/>, color: 'text-blue-400', border: 'border-blue-800' }));
                (selectedStaff.strikeHistory || []).forEach(s => rawEvents.push({ rawDate: s.date, type: 'strike', content: `Strike Lvl ${s.level}: ${s.reason}`, sub: `Expires: ${formatDate(s.expiryDate)}`, icon: <Gavel size={14}/>, color: 'text-red-400', border: 'border-red-800' }));
                return rawEvents.sort((a,b) => new Date(b.rawDate) - new Date(a.rawDate)).map(e => ({...e, date: formatDate(e.rawDate)}));
            }, [selectedStaff]);

            const handleCopyDM = async (type) => {
                setSGenerating(true);
                setNotifType(type);
                let prompt = `Write a professional Discord DM from the "Rescue Ops: Wildfire" Staff Manager to staff member "${selectedStaff.name}". `;
                
                if (type === 'strike') prompt += `Subject: Strike Notification (Level ${sLevel}). Reason: ${sReason}. Explain this is a formal warning.`;
                else if (type === 'review') prompt += `Subject: Performance Review. Stats: ${selectedStaff.weeklyTickets} tickets, ${selectedStaff.weeklyMessages} messages. Do NOT mention scheduling a voice meeting.`;
                else if (type === 'promotion') prompt = `Write a celebratory and professional Discord DM to "${selectedStaff.name}". Start by congratulating them on successfully passing their 14-day Trial Moderator period. Inform them they have been officially promoted to the rank of "Moderator". Additional Info: Let them know they now have access to advanced moderation commands (Ban/Kick) and the internal #staff-voting channel. Thank them for their hard work. Sign off exactly with: ~ rosachicken_`;

                const msg = await callGemini(prompt);
                setNotifContent(msg);
                setShowNotifModal(true);
                setSGenerating(false);

                // Delay the update to allow modal to open smoothly first
                if (type === 'promotion') {
                    setTimeout(() => {
                        const today = new Date().toISOString().split('T')[0];
                        const alreadyLogged = selectedStaff.notes.some(n => n.content.includes('Promotion DM Generated') && n.date === today);
                        if (!alreadyLogged) {
                            const newNote = { id: Date.now(), date: today, author: 'System', content: 'System: Generated Promotion Template' };
                            updateStaff({ ...selectedStaff, notes: [...selectedStaff.notes, newNote] });
                        }
                    }, 500);
                }
            };

            const handleFormalizeReason = async () => {
                if (!sReason) return;
                setSGenerating(true);
                const prompt = `Rewrite the following disciplinary reason to be professional, objective, and suitable for an official staff record (admin log). Keep it concise.\n\nInput: "${sReason}"`;
                const response = await callGemini(prompt);
                setSReason(response.replace(/"/g, ''));
                setSGenerating(false);
            };

            const handleSummarizeNotes = async () => {
                if (selectedStaff.notes.length === 0) { setSummary("No notes available to summarize."); return; }
                setSumLoading(true);
                const notesText = selectedStaff.notes.map(n => `[${n.date}] ${n.author}: ${n.content}`).join('\n');
                const prompt = `Analyze the following staff notes and provide a 3-bullet point summary of their performance, behavior, and any patterns. Keep it brief.\n\nNotes:\n${notesText}`;
                const response = await callGemini(prompt);
                setSummary(response);
                setSumLoading(false);
            };

            const submitStrike = () => {
                const today = new Date();
                const expiry = new Date();
                expiry.setDate(today.getDate() + STRIKE_EXPIRY_DAYS[sLevel]);
                const newStrike = { date: today.toISOString().split('T')[0], expiryDate: expiry.toISOString().split('T')[0], level: parseInt(sLevel), reason: sReason, active: true };
                const newHistory = [...selectedStaff.strikeHistory, newStrike];
                const totalStrikes = newHistory.filter(s => s.active).reduce((a,b) => a + b.level, 0);
                updateStaff({ ...selectedStaff, strikeHistory: newHistory, strikes: totalStrikes > 3 ? 3 : totalStrikes, notes: [...selectedStaff.notes, { id: Date.now(), date: newStrike.date, author: 'Manager', content: `Strike Lvl ${sLevel}: ${sReason}`, type: 'Warning' }] });
                setShowStrikeModal(false);

                                    <button onClick={() => deleteStaff(selectedStaff.id)} className="bg-red-950/30 hover:bg-red-900/50 text-red-400 border border-red-900/50 py-2 rounded text-sm flex justify-center gap-2 transition-all"><Trash2 size={16}/> Delete Record</button>
                                </div>

                                    const progress = Math.min(100, (daysIn / 14) * 100);
                                    const isExpired = daysIn >= 14;
                                    return (
                                        <div>
                                            <h3 className="text-gray-400 text-xs font-bold uppercase mb-4 flex items-center gap-2"><Clock size={14} className={isExpired ? "text-green-500" : "text-yellow-500"}/> Trial Progress</h3>

                                            <div className="w-full bg-gray-900 rounded-full h-2.5 overflow-hidden"><div className={`h-2.5 rounded-full transition-all duration-1000 ${isExpired ? 'bg-green-500' : 'bg-yellow-500'}`} style={{ width: `${progress}%` }}></div></div>
                                            {isExpired ? (
                                                <div className="mt-4">
                                                    <p className="text-xs text-green-400/80 bg-green-900/20 p-2 rounded border border-green-900/50 mb-3"><Check size={10} className="inline mr-1"/> Ready for promotion review.</p>
                                                    <button onClick={() => handleCopyDM('promotion')} className="w-full bg-green-700 hover:bg-green-600 text-white px-3 py-2 rounded text-sm flex items-center justify-center gap-2 font-bold shadow-lg shadow-green-900/20">{sGenerating ? <Loader2 className="animate-spin" size={14}/> : <Award size={14}/>} Promote & Notify</button>
                                                </div>
                                            ) : ( <p className="text-xs text-gray-500 mt-2">Evaluation due in {remaining} days.</p> )}

                                })()}

                                <div className="bg-gray-900 p-3 rounded"><div className="text-xs text-gray-500">Total Messages</div><div className="text-xl font-bold text-white">{selectedStaff.totalMessages || 0}</div></div>
                            </div>
                        </div>
                        <div className="bg-gray-800 rounded-lg p-6 border border-gray-700 relative">
                            <h3 className="text-gray-400 text-xs font-bold uppercase mb-4 flex items-center gap-2"><Activity size={14}/> Weekly Activity</h3>
                            <button onClick={() => setShowStatsModal(true)} className="absolute top-4 right-4 text-blue-400 hover:text-blue-300 text-xs font-bold flex items-center gap-1">+ Log Activity</button>

                                <div className="bg-gray-900 p-3 rounded"><div className="text-xs text-gray-500">Tickets</div><div className="text-xl font-bold text-white">{selectedStaff.weeklyTickets}</div></div>
                                <div className="bg-gray-900 p-3 rounded"><div className="text-xs text-gray-500">Messages</div><div className="text-xl font-bold text-white">{selectedStaff.weeklyMessages}</div></div>
                            </div>
                        </div>

                    <div className="flex-1 space-y-6 overflow-y-auto">
                        {selectedStaff.status !== 'Alumni' && (

                                <button onClick={() => selectedStaff.isOnLoa ? updateStaff({...selectedStaff, isOnLoa: false, status: 'Active', loaReturnDate: undefined}) : setShowLoaModal(true)} className={`${selectedStaff.isOnLoa ? 'bg-yellow-600 hover:bg-yellow-500' : 'bg-blue-700 hover:bg-blue-600'} text-white px-4 py-2 rounded text-sm flex items-center gap-2`}><Plane size={16}/> {selectedStaff.isOnLoa ? 'End LOA' : 'Start LOA'}</button>

                            </div>

                                    <div className="flex justify-between items-center mb-1"><span className="text-purple-400 text-xs font-bold uppercase">AI Summary</span><button onClick={() => setSummary('')}><X size={12}/></button></div>
                                    <div className="whitespace-pre-line">{summary}</div>

                            <div className="flex-1 overflow-auto p-4 space-y-4">
                                {timeline.map((event, idx) => (
                                    <div key={idx} className={`flex gap-3`}>
                                        <div className="flex flex-col items-center"><div className={`w-8 h-8 rounded-full flex items-center justify-center border-2 ${event.border} bg-gray-900 ${event.color} shrink-0`}>{event.icon}</div>{idx !== timeline.length - 1 && <div className="w-0.5 bg-gray-700 h-full mt-2"></div>}</div>
                                        <div className="pb-4"><div className="text-xs text-gray-500 mb-0.5">{event.date}</div><div className="text-gray-200 text-sm font-medium">{event.content}</div>{event.sub && <div className="text-gray-400 text-xs mt-1">{event.sub}</div>}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="p-4 bg-gray-900/30 border-t border-gray-700 shrink-0">
                                <div className="flex gap-2">
                                    <input className="flex-1 bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Add a quick note..." value={noteText} onChange={e => setNoteText(e.target.value)} onKeyDown={e => e.key === 'Enter' && noteText && (updateStaff({...selectedStaff, notes: [...(selectedStaff.notes || []), {id: Date.now(), date: new Date().toISOString().split('T')[0], author: 'Manager', content: noteText}]}), setNoteText(""))} />
                                    <button onClick={() => { if(noteText) { updateStaff({...selectedStaff, notes: [...(selectedStaff.notes || []), {id: Date.now(), date: new Date().toISOString().split('T')[0], author: 'Manager', content: noteText}]}); setNoteText(""); } }} className="bg-blue-600 text-white px-4 rounded text-sm">Post</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {/* Modals for ProfileView */}
                    {showNotifModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] animate-in fade-in">
                            <div className={`bg-gray-800 p-6 rounded-lg w-[600px] border ${notifType === 'promotion' ? 'border-green-500' : 'border-blue-600'} space-y-4 shadow-2xl`}>
                                <h3 className={`font-bold flex items-center gap-2 text-xl ${notifType === 'promotion' ? 'text-green-400' : 'text-white'}`}>{notifType === 'promotion' ? <Award size={24}/> : <Mail size={24}/>} {notifType === 'promotion' ? 'Promotion Announcement' : 'Notification Preview'}</h3>
                                <div className="bg-gray-900 p-4 rounded border border-gray-700"><textarea className="w-full h-48 bg-transparent text-gray-300 text-sm focus:outline-none resize-none" value={notifContent} readOnly /></div>
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setShowNotifModal(false)} className="text-gray-400 text-sm">Close</button>
                                    <button onClick={() => { copyToClipboard(notifContent); setShowNotifModal(false); }} className={`${notifType === 'promotion' ? 'bg-green-600 hover:bg-green-500' : 'bg-blue-600 hover:bg-blue-500'} text-white px-4 py-2 rounded text-sm flex items-center gap-2`}><Copy size={16}/> Copy to Clipboard</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {editMode && editFormData && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 animate-in fade-in">
                            <div className="bg-gray-800 p-6 rounded-lg w-[600px] border border-gray-600 space-y-4 max-h-[90vh] overflow-y-auto">
                                <h3 className="text-white font-bold text-lg flex items-center gap-2 border-b border-gray-700 pb-2"><Edit2 size={18}/> Edit Full Profile</h3>
                                <div className="grid grid-cols-2 gap-4"><Input label="Username" value={editFormData.name} onChange={v => setEditFormData({...editFormData, name: v})} /><Input label="Discord ID" value={editFormData.discordId} onChange={v => setEditFormData({...editFormData, discordId: v})} /></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-gray-400 text-xs mb-1">Role</label><select className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white text-sm" value={editFormData.role} onChange={e => setEditFormData({...editFormData, role: e.target.value})}>{Object.keys(ROLE_HIERARCHY).map(r => <option key={r} value={r}>{r}</option>)}</select></div>
                                    <div><label className="block text-gray-400 text-xs mb-1">Status</label><select className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white text-sm" value={editFormData.status} onChange={e => setEditFormData({...editFormData, status: e.target.value})}>{['Active', 'Inactive', 'Trial', 'LOA', 'Alumni'].map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                </div>
                                <div className="grid grid-cols-3 gap-4"><Input label="Country" value={editFormData.country} onChange={v => setEditFormData({...editFormData, country: v})} /><Input label="Timezone" value={editFormData.timezone} onChange={v => setEditFormData({...editFormData, timezone: v})} /><Input label="Language" value={editFormData.language} onChange={v => setEditFormData({...editFormData, language: v})} /></div>
                                <div className="grid grid-cols-2 gap-4"><Input label="Joined Date" type="date" value={editFormData.joinedDate} onChange={v => setEditFormData({...editFormData, joinedDate: v})} /><Input label="Last Active" type="date" value={editFormData.lastActiveDate} onChange={v => setEditFormData({...editFormData, lastActiveDate: v})} /></div>
                                <div className="p-3 bg-gray-900/50 rounded border border-gray-700"><h4 className="text-gray-400 text-xs font-bold uppercase mb-3">Admin Overrides</h4><div className="grid grid-cols-3 gap-4"><Input label="Strikes" type="number" value={editFormData.strikes} onChange={v => setEditFormData({...editFormData, strikes: parseInt(v) || 0})} /><Input label="Tickets" type="number" value={editFormData.weeklyTickets} onChange={v => setEditFormData({...editFormData, weeklyTickets: parseInt(v) || 0})} /><Input label="Messages" type="number" value={editFormData.weeklyMessages} onChange={v => setEditFormData({...editFormData, weeklyMessages: parseInt(v) || 0})} /></div></div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={() => setEditMode(false)} className="text-gray-400 px-4 py-2 text-sm hover:text-white">Cancel</button>
                                    <button onClick={() => { let updatedNotes = [...(editFormData.notes || [])]; if (editFormData.role !== selectedStaff.role) { const oldRank = ROLE_HIERARCHY[selectedStaff.role]; const newRank = ROLE_HIERARCHY[editFormData.role]; const isPromotion = oldRank > newRank; const action = isPromotion ? 'Promoted' : 'Demoted'; updatedNotes.push({ id: Date.now(), date: new Date().toISOString().split('T')[0], author: 'System', content: `System: ${action} from ${selectedStaff.role} to ${editFormData.role}` }); } updateStaff({...editFormData, notes: updatedNotes}); setEditMode(false); }} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded text-sm font-bold">Save Changes</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {showStrikeModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
                            <div className="bg-gray-800 p-6 rounded-lg w-[500px] border border-red-600 space-y-4">
                                <h3 className="text-red-400 font-bold flex items-center gap-2"><Gavel/> Issue Strike</h3>
                                <div><label className="text-xs text-gray-400 block mb-1">Level</label><select className="w-full bg-gray-900 border border-gray-700 text-white p-2 rounded" value={sLevel} onChange={e => setSLevel(e.target.value)}><option value="1">Strike 1 (Minor)</option><option value="2">Strike 2 (Major)</option><option value="3">Strike 3 (Critical)</option></select></div>
                                <div><div className="flex justify-between items-center mb-1"><label className="text-xs text-gray-400 block">Handbook Rule & Reason</label><button onClick={handleFormalizeReason} disabled={!sReason || sGenerating} className="text-[10px] bg-purple-900/50 text-purple-300 px-2 py-0.5 rounded border border-purple-800 hover:bg-purple-900 flex items-center gap-1">{sGenerating ? <Loader2 className="animate-spin" size={10}/> : <Sparkles size={10}/>} Formalize Text</button></div><select className="w-full bg-gray-900 border border-gray-700 text-white p-2 rounded text-sm mb-2" onChange={e => setSReason(prev => prev ? prev + " " + e.target.value : e.target.value)}><option value="">Select Violation...</option>{HANDBOOK_RULES.map(r => <option key={r.code} value={`${r.code} ${r.title}`}>{r.code} - {r.title}</option>)}</select><textarea className="w-full bg-gray-900 border border-gray-700 text-white p-2 rounded h-24 text-sm" placeholder="Reason (e.g., 'Rude to players')..." value={sReason} onChange={e => setSReason(e.target.value)} /></div>
                                <div className="flex justify-between items-center pt-4"><button onClick={() => handleCopyDM('strike')} disabled={!sReason || sGenerating} className="bg-purple-700 hover:bg-purple-600 text-white px-3 py-2 rounded text-xs flex items-center gap-2">{sGenerating ? <Loader2 className="animate-spin" size={14}/> : <Mail size={14}/>} Copy DM</button><div className="flex gap-2"><button onClick={() => setShowStrikeModal(false)} className="text-gray-400 text-sm">Cancel</button><button onClick={submitStrike} className="bg-red-600 text-white px-4 py-2 rounded text-sm">Confirm Strike</button></div></div>
                            </div>
                        </div>
                    )}
                    {showOffboardModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
                            <div className="bg-gray-800 p-6 rounded-lg w-96 border border-gray-600 space-y-4">
                                <h3 className="text-white font-bold flex items-center gap-2"><Archive/> Offboard Staff</h3>
                                <div className="flex gap-2"><button onClick={() => setExitReason('Resigned')} className={`flex-1 py-2 rounded text-sm ${exitReason==='Resigned'?'bg-blue-600 text-white':'bg-gray-700 text-gray-400'}`}>Resigned</button><button onClick={() => setExitReason('Terminated')} className={`flex-1 py-2 rounded text-sm ${exitReason==='Terminated'?'bg-red-600 text-white':'bg-gray-700 text-gray-400'}`}>Terminated</button></div>
                                <div className="flex items-center gap-2"><input type="checkbox" checked={rehire} onChange={e => setRehire(e.target.checked)} /><span className="text-gray-300 text-sm">Eligible for Rehire</span></div>
                                <div className="flex justify-end gap-2 mt-4"><button onClick={() => setShowOffboardModal(false)} className="text-gray-400 text-sm">Cancel</button><button onClick={() => { archiveStaff(selectedStaff.id, exitReason, rehire); setShowOffboardModal(false); }} className="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded text-sm">Confirm</button></div>
                            </div>
                        </div>
                    )}
                    {showLoaModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
                            <div className="bg-gray-800 p-6 rounded-lg w-80 border border-yellow-600 space-y-4">
                                <h3 className="text-white font-bold flex items-center gap-2"><Plane className="text-yellow-500"/> Start LOA</h3>
                                <p className="text-sm text-gray-400">When will they return?</p>
                                <Input type="date" value={loaDate} onChange={setLoaDate} />
                                <div className="flex justify-end gap-2 mt-4"><button onClick={() => setShowLoaModal(false)} className="text-gray-400 text-sm">Cancel</button><button onClick={confirmLoa} className="bg-yellow-600 text-white px-4 py-2 rounded text-sm">Confirm</button></div>
                            </div>
                        </div>
                    )}
                    {showStatsModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
                            <div className="bg-gray-800 p-6 rounded-lg w-80 border border-blue-600 space-y-4">
                                <h3 className="text-white font-bold flex items-center gap-2"><BarChart3 className="text-blue-500"/> Log Activity</h3>
                                <p className="text-sm text-gray-400">Add to current weekly counts.</p>
                                <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-gray-500 block mb-1">Add Tickets</label><input type="number" className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white" value={statsUpdate.tickets} onChange={e => setStatsUpdate({...statsUpdate, tickets: e.target.value})} /></div><div><label className="text-xs text-gray-500 block mb-1">Add Msgs</label><input type="number" className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white" value={statsUpdate.messages} onChange={e => setStatsUpdate({...statsUpdate, messages: e.target.value})} /></div></div>
                                <div className="flex justify-end gap-2 mt-4"><button onClick={() => setShowStatsModal(false)} className="text-gray-400 text-sm">Cancel</button><button onClick={updateStats} className="bg-blue-600 text-white px-4 py-2 rounded text-sm">Update</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ReportModal = ({ onClose }) => {
            const [reportText, setReportText] = useState("");
            const [loading, setLoading] = useState(true);
            const [progress, setProgress] = useState(0);
            const [loadTime, setLoadTime] = useState(0);
            const [staff, setStaff] = useState(() => JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || INITIAL_STAFF);

            useEffect(() => {
                const startTime = Date.now();
                let currentProgress = 0;
                const interval = setInterval(() => {
                    currentProgress += Math.random() * 15;
                    if (currentProgress >= 100) {
                        currentProgress = 100;
                        clearInterval(interval);
                        const activeStaff = staff.filter(s => s.status !== 'Alumni');
                        const totalTickets = activeStaff.reduce((acc, s) => acc + (parseInt(s.weeklyTickets) || 0), 0);
                        const totalMessages = activeStaff.reduce((acc, s) => acc + (parseInt(s.weeklyMessages) || 0), 0);
                        const sortedByPerformance = [...activeStaff].sort((a, b) => (parseInt(b.weeklyTickets) + parseInt(b.weeklyMessages)/20) - (parseInt(a.weeklyTickets) + parseInt(a.weeklyMessages)/20));
                        const topPerformer = sortedByPerformance[0];
                        const newHires = activeStaff.filter(s => calculateTimeInService(s.joinedDate).totalDays <= 7);
                        const loaStaff = activeStaff.filter(s => s.isOnLoa);
                        const report = `**Weekly Staff Update 📋**\n*Date: ${formatDate(new Date())}*\n\nHey team! Here is a quick rundown of how we performed this week.\n\n**🏆 Star Performer**\nA massive shoutout to **${topPerformer ? topPerformer.name : "N/A"}**! You absolutely crushed it this week with your activity. Keep it up!\n\n**📊 How We Did**\nAs a team, we handled **${totalTickets} tickets** and sent **${totalMessages} messages**.\nWe currently have **${activeStaff.length} active staff members**.\n\n**👋 Welcome to the Team**\n${newHires.length > 0 ? `Let's give a warm welcome to our newest additions:\n${newHires.map(s => `• <@${s.discordId}> (${s.role})`).join('\n')}` : "We didn't have any new joins this week."}\n\n**✈️ Away on Leave**\n${loaStaff.length > 0 ? `Just a reminder that these folks are currently on LOA:\n${loaStaff.map(s => `• ${s.name} (Back: ${s.loaReturnDate ? formatDate(s.loaReturnDate) : 'TBD'})`).join('\n')}` : "Full house! No one is currently on LOA."}\n\nThanks for all your hard work everyone.\n\n~ rosachicken_`.trim();
                        setReportText(report);
                        setLoadTime(((Date.now() - startTime) / 1000).toFixed(2));
                        setLoading(false);
                    }
                    setProgress(currentProgress);
                }, 100);
                return () => clearInterval(interval);
            }, [staff]);

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] animate-in fade-in backdrop-blur-sm">
                    <div className="bg-gray-800 p-6 rounded-lg w-[600px] border border-blue-600 space-y-4 shadow-2xl">
                        <h3 className="text-white font-bold flex items-center gap-2 text-xl"><ClipboardCheck className="text-blue-500"/> Weekly Report Generator</h3>
                        {loading ? (
                            <div className="py-12 space-y-6">
                                <div className="flex justify-center"><Loader2 className="animate-spin text-blue-500 w-12 h-12" /></div>
                                <div className="space-y-2"><div className="flex justify-between text-xs text-blue-300 font-bold uppercase tracking-widest"><span>Analyzing Data...</span><span>{Math.round(progress)}%</span></div><div className="w-full bg-gray-900 rounded-full h-4 overflow-hidden border border-gray-700 shadow-inner"><div className="bg-gradient-to-r from-blue-600 to-blue-400 h-full transition-all duration-200 ease-out" style={{ width: `${progress}%` }}></div></div></div>
                                <p className="text-center text-xs text-gray-500 animate-pulse">Calculating tickets, messages, and activity streaks...</p>
                            </div>
                        ) : (
                            <>
                                <div className="flex justify-between items-center text-sm text-gray-400 bg-gray-900/50 p-2 rounded border border-gray-700"><span>Report ready for distribution.</span><span className="text-xs text-green-400 bg-green-900/30 px-2 py-1 rounded border border-green-800 flex items-center gap-1"><TrendingUp size={12}/> Generated in {loadTime}s</span></div>
                                <div className="bg-gray-900 p-4 rounded border border-gray-700 shadow-inner"><textarea className="w-full h-64 bg-transparent text-gray-300 text-sm font-mono focus:outline-none resize-none" value={reportText} readOnly /></div>
                                <div className="flex justify-end gap-2"><button onClick={onClose} className="text-gray-400 hover:text-white px-4 py-2 rounded text-sm transition-colors">Close</button><button onClick={() => { copyToClipboard(reportText); onClose(); }} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded text-sm font-bold flex items-center gap-2 shadow-lg shadow-blue-900/20 transform hover:-translate-y-0.5 transition-all"><Copy size={16}/> Copy Report</button></div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const EndWeekModal = ({ staff, setStaff, onClose }) => {
            const [loading, setLoading] = useState(true);
            const [progress, setProgress] = useState(0);
            const [summary, setSummary] = useState(null);

            useEffect(() => {
                let currentProgress = 0;
                const interval = setInterval(() => {
                    currentProgress += 5; // Fast loading
                    setProgress(currentProgress);
                    
                    if (currentProgress >= 100) {
                        clearInterval(interval);
                        
                        // Perform the Update
                        let archivedTickets = 0;
                        let archivedMessages = 0;
                        
                        const updatedStaff = staff.map(s => {
                            const weeklyTix = parseInt(s.weeklyTickets) || 0;
                            const weeklyMsg = parseInt(s.weeklyMessages) || 0;
                            const totalTix = parseInt(s.totalTickets) || 0;
                            const totalMsg = parseInt(s.totalMessages) || 0;
                            
                            archivedTickets += weeklyTix;
                            archivedMessages += weeklyMsg;

                            return {
                                ...s,
                                totalTickets: totalTix + weeklyTix,
                                totalMessages: totalMsg + weeklyMsg,
                                weeklyTickets: 0,
                                weeklyMessages: 0
                            };
                        });
                        
                        setStaff(updatedStaff);
                        setSummary({ tickets: archivedTickets, messages: archivedMessages, count: updatedStaff.length });
                        setLoading(false);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] animate-in fade-in backdrop-blur-sm">
                    <div className="bg-gray-800 p-6 rounded-lg w-[500px] border border-red-600 space-y-4 shadow-2xl">
                        <h3 className="text-white font-bold flex items-center gap-2 text-xl"><RotateCcw className="text-red-500"/> End Week Processing</h3>
                        
                        {loading ? (
                            <div className="py-8 space-y-4">
                                <div className="space-y-2">
                                    <div className="flex justify-between text-xs text-red-300 font-bold uppercase tracking-widest">
                                        <span>Archiving Stats...</span>
                                        <span>{progress}%</span>
                                    </div>
                                    <div className="w-full bg-gray-900 rounded-full h-4 overflow-hidden border border-gray-700">
                                        <div className="bg-red-600 h-full transition-all duration-100 ease-out" style={{ width: `${progress}%` }}></div>
                                    </div>
                                </div>
                                <p className="text-center text-xs text-gray-500">Adding weekly totals to lifetime stats and resetting counters...</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="bg-green-900/20 border border-green-500/30 p-4 rounded text-center">
                                    <Check className="mx-auto text-green-500 mb-2" size={32} />
                                    <h4 className="text-green-400 font-bold text-lg">Week Ended Successfully</h4>
                                    <p className="text-gray-300 text-sm mt-2">
                                        Archived <strong>{summary.tickets} tickets</strong> and <strong>{summary.messages} messages</strong> across {summary.count} staff members.
                                    </p>
                                </div>
                                <button onClick={onClose} className="w-full bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-bold">Return to Dashboard</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const DeleteProfileModal = ({ staffMember, onDelete, onClose }) => {
            const [status, setStatus] = useState('confirm'); // confirm, deleting, done
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                if (status === 'deleting') {
                    let p = 0;
                    const interval = setInterval(() => {
                        p += 5;
                        setProgress(p);
                        if (p >= 100) {
                            clearInterval(interval);
                            setStatus('done');
                            onDelete();
                        }
                    }, 50); // 1s animation
                    return () => clearInterval(interval);
                }
            }, [status]);

            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] animate-in fade-in">
                    <div className="bg-gray-800 p-6 rounded-lg w-[400px] border border-red-600 shadow-2xl text-center">
                        {status === 'confirm' && (
                            <>
                                <div className="flex justify-center mb-4"><div className="bg-red-900/30 p-4 rounded-full"><Trash2 size={48} className="text-red-500"/></div></div>
                                <h3 className="text-xl font-bold text-white mb-2">Delete Profile?</h3>
                                <p className="text-gray-400 text-sm mb-6">Are you sure you want to permanently delete <strong>{staffMember?.name}</strong>? This action cannot be undone.</p>
                                <div className="flex gap-3 justify-center">
                                    <button onClick={onClose} className="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 text-white text-sm">Cancel</button>
                                    <button onClick={() => setStatus('deleting')} className="px-4 py-2 rounded bg-red-600 hover:bg-red-700 text-white text-sm font-bold">Delete Forever</button>
                                </div>
                            </>
                        )}
                        {status === 'deleting' && (
                            <div className="py-8">
                                <h3 className="text-white font-bold mb-4">Deleting Profile...</h3>
                                <div className="w-full bg-gray-900 rounded-full h-4 overflow-hidden border border-gray-700">
                                    <div className="bg-red-600 h-full transition-all duration-75 ease-out" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>
                        )}
                        {status === 'done' && (
                            <div className="py-4">
                                <div className="flex justify-center mb-4"><Check size={48} className="text-green-500"/></div>
                                <h3 className="text-xl font-bold text-white mb-2">Deleted</h3>
                                <p className="text-gray-400 text-sm mb-6">The staff profile has been successfully removed.</p>
                                <button onClick={onClose} className="w-full px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold">Return to Roster</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Dashboard = ({ staff, stats, setSelectedStaffId, setActiveTab, setShowReportModal, filteredTimezones, searchQuery, setSearchQuery, listModalConfig, setListModalConfig }) => {
            const [timeTrigger, setTimeTrigger] = useState(Date.now());
            useEffect(() => { const timer = setInterval(() => setTimeTrigger(Date.now()), 60000); return () => clearInterval(timer); }, []);
            
            const openPendingReview = () => { setListModalConfig({ title: 'Pending Review (Trial Expired)', list: staff.filter(s => s.status !== 'Alumni' && s.status === 'Trial' && calculateTimeInService(s.joinedDate).totalDays >= 14) }); };
            const openAtRisk = () => { setListModalConfig({ title: 'At Risk Staff', list: staff.filter(s => s.status !== 'Alumni' && (s.strikes >= 2 || calculateTimeInService(s.lastActiveDate).totalDays > 7)) }); };
            const expiredTrials = staff.filter(s => s.role === 'Trial Moderator' && calculateTimeInService(s.joinedDate).totalDays >= 14 && s.status !== 'Alumni');

            return (
                <div className="space-y-6 animate-in fade-in duration-500 pb-10">

                        <div className="absolute top-[40%] left-[15%] group cursor-help"><div className="absolute -inset-2 bg-blue-500/20 rounded-full animate-ping"></div><div className="w-2 h-2 bg-blue-400 rounded-full relative z-10 border border-blue-200"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">US West: {calcTime(-8)}</div></div>
                        <div className="absolute top-[40%] left-[25%] group cursor-help"><div className="absolute -inset-2 bg-purple-500/20 rounded-full animate-ping delay-75"></div><div className="w-2 h-2 bg-purple-400 rounded-full relative z-10 border border-purple-200"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">US East: {calcTime(-5)}</div></div>
                        <div className="absolute top-[70%] left-[32%] group cursor-help"><div className="absolute -inset-2 bg-green-500/20 rounded-full animate-ping delay-1000"></div><div className="w-2 h-2 bg-green-400 rounded-full relative z-10 border border-green-200"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">Sao Paulo: {calcTime(-3)}</div></div>
                        <div className="absolute top-[35%] left-[48%] group cursor-help"><div className="absolute -inset-2 bg-green-500/20 rounded-full animate-ping delay-150"></div><div className="w-2 h-2 bg-green-400 rounded-full relative z-10 border border-green-200"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">London: {calcTime(0)}</div></div>
                        <div className="absolute top-[38%] left-[51%] group cursor-help"><div className="w-2 h-2 bg-green-600 rounded-full relative z-10 opacity-50"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">Frankfurt: {calcTime(1)}</div></div>
                        <div className="absolute top-[75%] left-[54%] group cursor-help"><div className="w-2 h-2 bg-yellow-600 rounded-full relative z-10 opacity-60"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">Johannesburg: {calcTime(2)}</div></div>
                        <div className="absolute top-[45%] left-[62%] group cursor-help"><div className="absolute -inset-2 bg-purple-500/20 rounded-full animate-ping delay-500"></div><div className="w-2 h-2 bg-purple-400 rounded-full relative z-10 border border-purple-200"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">Dubai: {calcTime(4)}</div></div>
                        <div className="absolute top-[48%] left-[70%] group cursor-help"><div className="w-2 h-2 bg-orange-400 rounded-full relative z-10 opacity-70"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">New Delhi: {calcTime(5.5)}</div></div>
                        <div className="absolute top-[58%] left-[78%] group cursor-help"><div className="absolute -inset-2 bg-blue-500/20 rounded-full animate-ping delay-700"></div><div className="w-2 h-2 bg-blue-400 rounded-full relative z-10 border border-blue-200"></div><div className="absolute top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">Singapore: {calcTime(8)}</div></div>
                        <div className="absolute top-[40%] left-[82%] group cursor-help"><div className="absolute -inset-2 bg-red-500/20 rounded-full animate-ping delay-300"></div><div className="w-2 h-2 bg-red-400 rounded-full relative z-10 border border-red-200"></div><div className="absolute top-4 right-0 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">Tokyo: {calcTime(9)}</div></div>
                        <div className="absolute top-[70%] left-[88%] group cursor-help"><div className="absolute -inset-2 bg-yellow-500/20 rounded-full animate-ping delay-500"></div><div className="w-2 h-2 bg-yellow-400 rounded-full relative z-10 border border-yellow-200"></div><div className="absolute bottom-4 right-0 bg-gray-900 text-[10px] px-2 py-1 rounded border border-gray-700 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-20">Sydney: {calcTime(11)}</div></div>
                    </div></div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-gray-800 rounded-lg border border-gray-700 flex flex-col h-[400px]">
                            <div className="p-4 border-b border-gray-700"><h3 className="text-gray-400 text-xs font-bold uppercase mb-2 flex items-center gap-2"><Globe size={16} /> Timezone Directory</h3><div className="relative"><Search className="absolute left-2 top-2 w-3 h-3 text-gray-500" /><input type="text" placeholder="Search country or zone..." className="w-full bg-gray-900 border border-gray-600 rounded pl-7 py-1 text-xs text-white focus:border-blue-500 focus:outline-none" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} /></div></div>
                            <div className="flex-1 overflow-y-auto p-2 space-y-1">{filteredTimezones.map((tz, idx) => ( <div key={idx} className="flex justify-between items-center p-2 rounded hover:bg-gray-700 text-xs"><div><div className="font-bold text-gray-200">{tz.country}</div><div className="text-gray-500">{tz.zone}</div></div><div className="font-mono text-blue-300 bg-blue-900/30 px-2 py-1 rounded">{calcTime(tz.offset)}</div></div> ))} {filteredTimezones.length === 0 && <div className="text-center text-gray-500 py-4 text-xs">No matching zones found.</div>}</div>
                        </div>
                        <div className="lg:col-span-2 space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-center"><h3 className="text-gray-400 text-xs font-bold uppercase mb-4 flex items-center gap-2"><Globe size={16} /> Regional Staffing</h3><div className="space-y-6"><CoverageBar label="Americas (NA/SA)" count={stats.regions.Americas} total={stats.total} color="bg-blue-500" /><CoverageBar label="Europe / Africa (EMEA)" count={stats.regions.EMEA} total={stats.total} color="bg-purple-500" /><CoverageBar label="Asia (APAC)" count={stats.regions.APAC} total={stats.total} color="bg-green-500" /><CoverageBar label="Oceania (AUS/NZ)" count={stats.regions.Oceania} total={stats.total} color="bg-yellow-500" /></div></div>
                                <div className="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col justify-center"><h3 className="text-gray-400 text-xs font-bold uppercase mb-4 flex items-center gap-2"><Users size={16} /> Staff Hierarchy</h3><div className="space-y-5"><CoverageBar label="Community Manager" count={stats.roleBreakdown.cm} total={stats.total} color="bg-red-400" /><CoverageBar label="Staff Manager" count={stats.roleBreakdown.sm} total={stats.total} color="bg-purple-400" /><CoverageBar label="Head of Moderation" count={stats.roleBreakdown.head} total={stats.total} color="bg-blue-400" /><CoverageBar label="Moderator" count={stats.roleBreakdown.mod} total={stats.total} color="bg-green-400" /><CoverageBar label="Trial Moderator" count={stats.roleBreakdown.trial} total={stats.total} color="bg-yellow-400" /></div></div>
                                <div className="bg-gray-800 p-6 rounded-lg border border-gray-700 md:col-span-2"><h3 className="text-gray-400 text-xs font-bold uppercase mb-4 flex items-center gap-2"><Gavel size={16} /> Watchlist</h3><div className="space-y-2 h-[200px] overflow-y-auto pr-2">{staff.filter(s => s.strikes > 0 && s.status !== 'Alumni').length === 0 ? <div className="text-gray-500 text-sm text-center py-8">No active strikes.</div> : staff.filter(s => s.strikes > 0 && s.status !== 'Alumni').map(s => ( <div key={s.id} className="flex justify-between items-center p-3 bg-gray-900 rounded hover:bg-gray-700 cursor-pointer" onClick={() => { setSelectedStaffId(s.id); setActiveTab('profile'); }}><div className="flex items-center gap-3"><img src={s.avatarUrl} className="w-8 h-8 rounded-full" /><div><div className="text-sm font-bold text-white">{s.name}</div><div className="text-xs text-red-400">{s.strikes} Strikes</div></div></div><ChevronRight size={16} className="text-gray-500" /></div> ))}</div></div>
                            </div>
                        </div>
                    </div>
                    {listModalConfig && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 animate-in fade-in">
                            <div className="bg-gray-800 p-6 rounded-lg w-[500px] border border-gray-600 max-h-[80vh] flex flex-col shadow-2xl">
                                <div className="flex justify-between items-center mb-4 border-b border-gray-700 pb-4"><h3 className="text-xl font-bold text-white flex items-center gap-2">{listModalConfig.title.includes('Risk') ? <AlertTriangle className="text-red-400"/> : <FileText className="text-purple-400"/>} {listModalConfig.title}</h3><button onClick={() => setListModalConfig(null)} className="text-gray-400 hover:text-white transition-colors"><X size={24}/></button></div>
                                <div className="overflow-y-auto flex-1 space-y-2 pr-2">{listModalConfig.list.length === 0 ? <div className="text-gray-500 text-center py-8">No staff found in this category.</div> : listModalConfig.list.map(s => ( <div key={s.id} onClick={() => { setSelectedStaffId(s.id); setActiveTab('profile'); }} className="flex justify-between items-center p-4 bg-gray-900 rounded-lg hover:bg-gray-700 cursor-pointer border border-gray-700 transition-colors group"><div className="flex items-center gap-4"><img src={s.avatarUrl} className="w-10 h-10 rounded-full bg-gray-800" /><div><div className="font-bold text-white group-hover:text-blue-400 transition-colors">{s.name}</div><div className="text-xs text-gray-400 flex items-center gap-2"><span className={ROLE_COLORS[s.role]}>{s.role}</span>{s.strikes > 0 && <span className="text-red-500 font-bold">• {s.strikes} Strikes</span>}</div></div></div><ChevronRight size={18} className="text-gray-600 group-hover:text-white" /></div> ))}</div>
                            </div>
